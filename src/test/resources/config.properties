# ============================================================
# NopCommerce Automation — Runtime Configuration
# ============================================================
# Override any property at runtime via Maven -D flag:
#   mvn test -Dbrowser=firefox -Dheadless=true
# ============================================================

# Browser: chrome | firefox
browser=chrome

# Set to true for CI/CD pipelines (no GUI)
headless=false

# Timeouts (seconds)
implicit.wait.seconds=10
explicit.wait.seconds=15

# Application URL
base.url=https://admin-demo.nopcommerce.com

# Admin credentials
# IMPORTANT: For production pipelines, inject these as environment variables
#            or secrets — never commit real credentials to source control.
admin.email=admin@yourstore.com
admin.password=admin
