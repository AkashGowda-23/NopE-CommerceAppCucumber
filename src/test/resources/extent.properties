# Extent Reports configuration for the Cucumber7 adapter
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-reports/SparkReport.html
extent.reporter.spark.vieworder=dashboard,test,author,device,exception,log
extent.reporter.spark.offlineMode=false

# Optional: attach screenshots to the report
screenshot.dir=target/screenshots
screenshot.rel.path=../../screenshots/
