# ============================================================
# GitHub Actions CI — NopCommerce Cucumber Automation
# Runs on every push to master and every pull request.
# ============================================================
name: Automation Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # Manual trigger with optional tag filter
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression (e.g. @smoke)'
        required: false
        default: 'not @wip'

jobs:
  test:
    name: Run Selenium + Cucumber Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests (headless)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mvn test \
            -Dheadless=true \
            -Dbrowser=chrome \
            -Dadmin.email="${ADMIN_EMAIL}" \
            -Dadmin.password="${ADMIN_PASSWORD}" \
            -Dcucumber.filter.tags="${{ github.event.inputs.tags || 'not @wip' }}" \
            --no-transfer-progress

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/
          retention-days: 14

      - name: Upload Cucumber JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: target/cucumber-reports/
          retention-days: 14

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/logs/
          retention-days: 7
